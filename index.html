<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Multimedia y Cursos Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- ESPACIO PARA ANUNCIO DE MONETAG (BANNER SUPERIOR) -->
    <!-- Inserta tu script de banner de Monetag aquí -->
</head>
<body>

    <header>
        <h1>🎵 Reproductor & Cursos Pro</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar música, videos o cursos...">
            <button id="searchBtn">Buscar</button>
        </div>
    </header>

    <main class="container">
        <!-- Sección del Reproductor (Aislamiento de Monetag para evitar pestañas basura) -->
        <section class="player-section">
            <div id="videoContainer">
                <!-- Por defecto se carga un video de bienvenida o curso -->
                <iframe id="youtubePlayer" width="100%" height="400px" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="player-info">
                <h3 id="currentTitle">Reproduciendo: Curso de Bienvenida</h3>
                <!-- ZONA DE VALOR AGREGADO / ENLACE MONETAG CONTROLADO (Opcional, sin afectar el reproductor) -->
                <div class="monetag-promo-box">
                    <p>💡 ¿Te gusta esta app? Apóyanos visitando a nuestros patrocinadores:</p>
                    <a href="TU_ENLACE_DIRECTO_MONETAG" target="_blank" class="promo-btn" id="monetagBtn">Ver Oferta Especial 🎁</a>
                </div>
            </div>
        </section>

        <!-- Sección de Cursos Precargados -->
        <section class="courses-section">
            <h2>📚 Cursos Precargados</h2>
            <div id="courseList" class="grid">
                <!-- Generado por JavaScript -->
            </div>
        </section>

        <!-- Resultados de Búsqueda de YouTube -->
        <section class="results-section">
            <h2>🔍 Resultados de YouTube</h2>
            <p class="instruction-note">⚠️ <strong>Nota para la API:</strong> Integra tu clave de YouTube Data v3 API en <code>js/app.js</code> en la línea indicada.</p>
            <div id="searchResults" class="grid">
                <!-- Los resultados de la búsqueda aparecerán aquí -->
            </div>
        </section>
    </main>

    <!-- ESPACIO PARA ANUNCIO DE MONETAG (BANNER INFERIOR) -->
    <!-- Inserta tu script de banner inferior de Monetag aquí -->

    <script src="js/app.js"></script>
</body>
</html>
